<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Image Targets</title>
  <meta itemprop="name" content="Image Targets">
  <meta name="twitter:title" content="Image Targets">
  <meta property="og:title" content="Image Targets">
  <meta property="og:site_name" content="Image Targets">
  <meta name="description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world.">

  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <meta property="og:image" content="https://8thwall.org/studio-image-targets-example/assets/preview.png">
  
  <style>
    #target-loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.7); color: #fff;
      font-family: sans-serif;
      transition: opacity .3s;
    }
    #target-loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #fff; border-top-color: transparent;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #target-loading.no-spinner .spinner { display: none; }

    #viewfinder-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 55%,
        rgba(0, 0, 0, 0.5) 100%
      );
      z-index: 10;
    }
  </style>


</head>

<body>
<script src="bundle.js"></script>


  <div id="target-loading">
    <!-- <link rel="stylesheet" href="main.css"> -->
    <div class="spinner"></div>
    <p id="target-loading-text">Loading…</p>
  </div>

  <div id="viewfinder-mask"></div>

</body>

</html>
